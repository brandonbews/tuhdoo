# Release pipeline: a pushed v* tag becomes a GitHub Release carrying
# cross-compiled, checksummed binaries for the four supported platforms
# (windows is parked). Hand-rolled rather than goreleaser: everything
# that runs is visible in this one file, and the only third-party code
# is actions/checkout and actions/setup-go, pinned by commit SHA.
#
# Host-agnosticism (T2) is untouched: this pipeline publishes artifacts;
# the binary itself never learns about GitHub. Triggering is tag-only,
# so the tuhdoo data branch can never fire it.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Test and lint
        run: make test lint

      - name: Cross-compile
        # GITHUB_REF_NAME is the tag (e.g. v0.1.0); using the runner's
        # env var, not ${{ }} interpolation, keeps the value out of the
        # script text. Each archive contains the single static binary.
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${os}_${arch}/tuhdoo" ./cmd/tuhdoo
            tar -czf "dist/tuhdoo_${version}_${os}_${arch}.tar.gz" \
              -C "dist/${os}_${arch}" tuhdoo
          done

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum tuhdoo_*.tar.gz > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/checksums.txt \
            --title "tuhdoo $GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes

  # npm tier: republishes the exact released bytes as the esbuild-pattern
  # packages (tuhdoo launcher + @tuhdoo/<os>-<cpu> binaries). A separate
  # job so an npm failure never blocks the GitHub Release, and a re-run
  # after a partial publish touches only this job. Uses the runner's own
  # node — no third-party actions beyond the pinned checkout.
  # Auth is OIDC trusted publishing: each of the five packages names this
  # repo + workflow file as its trusted publisher on npmjs.com, and npm
  # exchanges the job's identity token for a short-lived publish grant.
  # No token secret exists anywhere. Provenance is NOT automatic despite
  # npm's docs: the CLI's auto-enable silently skipped it on v0.1.1 (its
  # failure reasons log only at verbose level), so publish passes
  # --provenance explicitly — then a provenance failure fails the publish
  # loudly instead of shipping an unattested package.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read # download the release assets; publishing goes to npm
      id-token: write # mint the OIDC token npm exchanges for a publish grant
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Fetch release binaries
        # Download rather than rebuild: npm ships byte-identical binaries
        # to the GitHub Release. Archive names look like
        # tuhdoo_v0.1.0_darwin_arm64.tar.gz; unpack each into the
        # dist/<os>_<arch>/tuhdoo layout npm/prepare.js expects.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern 'tuhdoo_*.tar.gz' --dir dist
          for f in dist/tuhdoo_*.tar.gz; do
            base="${f##*/}"; base="${base%.tar.gz}"
            arch="${base##*_}"; rest="${base%_*}"; os="${rest##*_}"
            mkdir -p "dist/${os}_${arch}"
            tar -xzf "$f" -C "dist/${os}_${arch}"
          done

      - name: Publish to npm
        # Platform packages first so the launcher's optionalDependencies
        # resolve the moment it lands. Trusted publishing needs npm 11.5.1+
        # (OIDC detection landed there); the runner's preinstalled npm is
        # older, so upgrade it first — visible, no third-party action.
        run: |
          set -euo pipefail
          sudo npm install -g npm@11
          node --version && npm --version
          version="${GITHUB_REF_NAME#v}"
          node npm/prepare.js "$version" dist npm-out
          # Idempotent per package: a partial failure (token scope, network)
          # must be recoverable by re-running this job, so "this exact
          # version is already on the registry" is a skip, not an error.
          # Matched on npm's E403 message text rather than a pre-publish
          # `npm view`, which lags behind fresh publishes.
          publish() {
            local out
            if out=$(npm publish "$1" --access public --provenance 2>&1); then
              printf '%s\n' "$out" | tail -n 3
            elif printf '%s' "$out" | grep -q 'previously published'; then
              echo "already published, skipping: $1"
            else
              printf '%s\n' "$out"
              return 1
            fi
          }
          for p in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            publish "./npm-out/$p"
          done
          publish ./npm-out/tuhdoo
